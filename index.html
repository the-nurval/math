<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta property="og:title" content="Math Check">
<meta property="og:image" content="https://math-nurval.vercel.app/brand/og-image-light-1200x630.png">
<title>Math Check</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Сетка Stretch по правилам Zippun: контент по центру до 820 px, отступы кратны 4 (8/12/16/24/32), высота контролов 42 px (44 на телефоне), скругления по правилу вложенных радиусов (внутренний = внешний − отступ, шаг 4): контролы 12; карточка 28 = 12 + отступ 16 (одинаковый для текста и контролов); переключатель 12 → 2 → 10; диалог 24; задание в листе 20 = поле 8 + отступ 12; телефон до 850 px */
:root{
  --bg:#e9edf2; --paper:#fbfcfd; --grid:#dfe7f0; --margin:#efb9b9; --panel:#ffffff; --soft:#f2f5f8;
  --ink:#1d2533; --muted:#5d6878; --line:#cfd8e3;
  --pen:#2348b8; --pen-soft:#e6ecfb;
  --red:#cc2f2f; --green:#1f8a4c; --amber:#a86a00;
  --h0:#e4e9f0; --h1:#bccbf0; --h2:#7d98e0; --h3:#2348b8;
  --bar:#ffffffee;
  --seg-track:#eef1f0; --seg-thumb:#ffffff;
  --ctl:42px; --r-ctl:12px; --r-card:28px; --r-dlg:24px; --r-item:20px; --r-in:8px; --pad-card:16px; --pad-item:12px;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-hand:"Caveat","Comic Sans MS",cursive;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161d; --paper:#1a2029; --grid:#222a35; --margin:#4a2a2e; --panel:#1d242e; --soft:#232b36;
  --ink:#e6eaf0; --muted:#97a2b2; --line:#2e3846;
  --pen:#8fb0ff; --pen-soft:#24304a;
  --red:#ff7a72; --green:#5fd394; --amber:#f0b44c;
  --h0:#262e3a; --h1:#33456e; --h2:#5576c0; --h3:#9db8ff;
  --bar:#1a2029ee; --seg-track:#232b36; --seg-thumb:#3a4555; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --paper:#1a2029; --grid:#222a35; --margin:#4a2a2e; --panel:#1d242e; --soft:#232b36;
  --ink:#e6eaf0; --muted:#97a2b2; --line:#2e3846;
  --pen:#8fb0ff; --pen-soft:#24304a;
  --red:#ff7a72; --green:#5fd394; --amber:#f0b44c;
  --h0:#262e3a; --h1:#33456e; --h2:#5576c0; --h3:#9db8ff;
  --bar:#1a2029ee; --seg-track:#232b36; --seg-thumb:#3a4555; color-scheme:dark}
@media (max-width:849px){:root{--ctl:44px}}

/* место под полосу прокрутки зарезервировано всегда, чтобы экраны не сдвигались; сама полоса не выделяется */
html{scrollbar-gutter:stable;scrollbar-color:var(--line) transparent;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
button{font-family:var(--f-body);color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}

/* навбар */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--panel);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.nav-in{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:4px 16px;flex-wrap:wrap;min-width:0}
.ttl{font:700 1.1rem var(--f-body);background:none;border:0;padding:0;cursor:pointer;white-space:nowrap}
.navlink{font:600 .92rem var(--f-body);background:none;border:0;padding:0;color:var(--pen);cursor:pointer}
.navlink[aria-current="page"]{text-decoration:underline;text-underline-offset:4px}
.nav-r{display:flex;align-items:center;gap:8px}
.ib{width:var(--ctl);height:var(--ctl);border-radius:var(--r-ctl);border:0;background:transparent;display:grid;place-items:center;cursor:pointer}
.ib:hover,.ib[aria-current="page"]{background:var(--soft)}
.ib svg{width:24px;height:24px}

.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 128px}

/* элементы управления: одна высота */
.seg{display:flex;gap:2px;height:var(--ctl);box-sizing:border-box;padding:2px;border:0;border-radius:var(--r-ctl);background:var(--seg-track)}
.seg button{flex:1 1 auto;height:100%;padding:0 12px;border:0;border-radius:calc(var(--r-ctl) - 2px);background:transparent;color:var(--muted);font-size:.92rem;font-weight:500;line-height:1.2;cursor:pointer;min-width:0;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--seg-thumb);color:var(--ink);font-weight:600;box-shadow:0 2px 6px rgb(0 0 0/14%),0 1px 1px rgb(0 0 0/6%)}
.seg button:disabled{opacity:.55;cursor:not-allowed}
.seg.sm button{padding:0 12px;font-size:.84rem}
input[type=date],input.num,input.txt{height:var(--ctl);box-sizing:border-box;font:500 .98rem var(--f-body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--r-ctl);padding:0 12px;min-width:0}
input.num{width:5.5em}
input.num:disabled{opacity:.45}
.unit{color:var(--muted)}
.unit.off{opacity:.45}

/* шапка главной */
.head{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--pad-card);display:grid;gap:16px}
.ctrls{display:grid;grid-template-columns:auto auto;justify-content:start;gap:16px 32px}
.ctrls .full{grid-column:1/-1}
.ctrl{display:grid;gap:8px;min-width:0;align-content:start}
.ctrl>span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;line-height:1}
.tline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 16px;align-items:center;border-top:1px solid var(--line);padding-top:16px}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 12px 5px;font-size:.84rem;line-height:1.2;color:var(--muted);background:var(--paper)}
.chip.now{border-color:var(--pen);color:var(--pen)}
.btn{height:var(--ctl);box-sizing:border-box;font:600 .98rem var(--f-body);padding:0 16px;border-radius:var(--r-ctl);border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.empty{padding:32px 8px;color:var(--muted);text-align:center}

/* лист работы */
.sheet{margin-top:16px;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:var(--r-card);padding-block:24px 32px;padding-left:clamp(16px,6vw,48px);padding-right:clamp(16px,4vw,32px);position:relative}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:clamp(8px,4vw,32px);width:1px;background:var(--margin)}
.sheet-head{display:grid;gap:4px}
.sheet-head h2{margin:0;font-size:1.2rem;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:.9rem}
.hint{margin:16px 0 0;font-size:.88rem;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:var(--r-in);padding:8px 12px}
.hint code{font-family:var(--f-mono);font-size:.82rem;color:var(--pen)}
.score{margin-top:16px;border:2px solid var(--red);border-radius:var(--r-item);padding:var(--pad-item) 16px;background:var(--paper);display:grid;gap:8px}
.score .big{font-family:var(--f-hand);color:var(--red);font-size:2.2rem;line-height:1}
.meter{height:8px;border-radius:4px;background:var(--h0);overflow:hidden}
.meter i{display:block;height:100%;background:var(--red);border-radius:4px}
.score ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{color:var(--ink)}
.note{font-size:.85rem;color:var(--amber)}
.task{margin-top:24px}
.task-h{display:flex;gap:8px 12px;align-items:baseline;flex-wrap:wrap}
.task-h h3{margin:0;font-size:1.05rem}
.task-h .pts,.task-h .tm{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.task-h .star{color:var(--red);font-weight:700}
.task-h .got{margin-left:auto;font-family:var(--f-hand);font-size:1.5rem;color:var(--red);line-height:1}
.intro{margin:8px 0 0;font-size:.98rem}
.items{display:grid;gap:8px;margin-top:12px}
.item{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-item);padding:var(--pad-item);display:grid;gap:8px;min-width:0}
.item.ok{border-color:var(--green);box-shadow:inset 4px 0 0 var(--green)}
.item.bad{border-color:var(--red);box-shadow:inset 4px 0 0 var(--red)}
.item.part{border-color:var(--amber);box-shadow:inset 4px 0 0 var(--amber)}
.row{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;min-width:0}
.lbl{font-weight:600;color:var(--muted);min-width:1.6em}
.expr{font-size:1.05rem;min-width:0;overflow-wrap:anywhere;flex:1 1 auto}
.expr.text{font-size:.98rem;flex:1 1 calc(100% - 3em)}
.ansline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.expr.text~.ansline{flex-basis:100%}
.eq{color:var(--muted)}
input.ans{height:var(--ctl);box-sizing:border-box;font:500 1.05rem var(--f-mono);color:var(--pen);background:var(--pen-soft);border:1px solid transparent;border-bottom:2px solid var(--pen);border-radius:var(--r-in) var(--r-in) 0 0;padding:0 8px;width:9em;max-width:100%}
input.ans.wide{width:13em}
input.ans.small{width:5em}
input.ans:disabled{opacity:1;-webkit-text-fill-color:var(--pen)}
textarea.proof{font:400 .95rem var(--f-body);color:var(--pen);background:var(--pen-soft);border:1px solid var(--line);border-radius:var(--r-in);padding:8px 12px;width:100%;min-height:6em;resize:vertical;box-sizing:border-box}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{height:var(--ctl);box-sizing:border-box;font:500 .92rem var(--f-body);padding:0 16px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--paper);cursor:pointer}
.opt[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:var(--paper)}
.opt:disabled{cursor:default}
.mark{font-family:var(--f-hand);font-size:1.7rem;line-height:1;margin-left:auto}
.ok .mark{color:var(--green)} .bad .mark{color:var(--red)}
.res{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;font-size:.92rem}
.res .right{color:var(--muted)}
.res .right b{color:var(--ink);font-weight:600}
.why{font:600 .85rem var(--f-body);color:var(--pen);background:none;border:none;padding:4px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.exp{font-size:.93rem;border-left:2px solid var(--pen);padding:4px 0 4px 12px}
.exp p{margin:0 0 4px}.exp p:last-child{margin:0}
.exp .alt{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.selfgrade{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.9rem}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.85em;line-height:1.1;margin:0 .1em}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .15em}
.fr>span:last-child{padding:0 .15em}
svg.sk{display:block;width:220px;max-width:100%;height:auto;margin:4px 0 8px;color:var(--ink)}
sup{font-size:.7em}

/* экраны настроек, FAQ, программы, профиля — та же ширина, что и главная */
.subhead{display:flex;align-items:center;gap:8px;margin:0 0 8px -8px;min-height:var(--ctl)}
.subhead h2{margin:0;font-size:1.5rem;line-height:1.2}
.back{width:var(--ctl);height:var(--ctl);border:0;background:transparent;border-radius:var(--r-ctl);display:grid;place-items:center;cursor:pointer}
.back:hover{background:var(--soft)}
.sec{margin:24px 0 8px;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.group{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:var(--pad-card);min-height:56px;box-sizing:border-box}
.srow+.srow{border-top:1px solid var(--line)}
.srow .k{color:var(--muted)}
.srow.link{cursor:pointer;width:100%;border:0;background:transparent;text-align:left;font:inherit}
.srow.link:hover{background:var(--soft)}
.chev{width:20px;height:20px;color:var(--muted)}
.faq details{border-top:1px solid var(--line)}
.faq details:first-child{border-top:0}
.faq summary{padding:16px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--muted)}
.faq details[open] summary::after{content:"−"}
.faq .a{padding:0 16px 16px;font-size:.95rem}
.faq .a p{margin:0 0 8px}
.faq code{font-family:var(--f-mono);font-size:.82rem;color:var(--pen)}
.lvl{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:4px 12px;margin:8px 0}

.prog{list-style:none;margin:0;padding:0}
.prog li{display:grid;grid-template-columns:3.6em minmax(0,1fr) auto;gap:12px;align-items:center;padding:var(--pad-card);font-size:.95rem}
.prog li+li{border-top:1px solid var(--line)}
.prog .wk{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82rem;line-height:1.25}
.st{font-size:.78rem;border-radius:999px;padding:4px 8px 5px;line-height:1.1;border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.st.done{color:var(--green);border-color:var(--green)}
.st.now{color:var(--pen);border-color:var(--pen)}

.pcard{display:grid;grid-template-columns:56px minmax(0,1fr);gap:4px 16px;align-items:center;padding:16px}
.ava{width:56px;height:56px;border-radius:50%;background:var(--pen-soft);color:var(--pen);display:grid;place-items:center;font-weight:700;font-size:1.4rem;grid-row:span 2}
.pcard input.txt{font-weight:600;font-size:1.05rem;width:100%;max-width:280px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.kpi{padding:var(--pad-card);display:grid;gap:4px;min-width:0}
.kpi+.kpi{border-left:1px solid var(--line)}
.kpi b{font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:.78rem;color:var(--muted)}
.chartbox{padding:var(--pad-card);min-width:0}
.heat{display:block;max-width:100%;height:auto}
.trend{display:block;width:100%;height:auto}
.trend text,.heat text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.legend{display:flex;gap:8px;align-items:center;font-size:.78rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(60px,140px) 3.2em 1.6em;gap:12px;align-items:center;padding:var(--pad-card)}
.trow+.trow{border-top:1px solid var(--line)}
.trow .meter i{background:var(--pen)}
.trow.weak .meter i{background:var(--red)}
.trow .pc{text-align:right;font-variant-numeric:tabular-nums}
.arrow{text-align:center;font-weight:700}
.arrow.up{color:var(--green)} .arrow.down{color:var(--red)} .arrow.flat{color:var(--muted)}
.tag-weak{font-size:.72rem;color:var(--red);border:1px solid var(--red);border-radius:999px;padding:0 8px;margin-left:8px;white-space:nowrap}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:var(--pad-card);width:100%;border:0;background:transparent;font:inherit;text-align:left;cursor:pointer;box-sizing:border-box}
.hrow+.hrow{border-top:1px solid var(--line)}
.hrow:hover{background:var(--soft)}
.hrow .s{font-variant-numeric:tabular-nums;font-weight:600}
.hrow .m{font-size:.82rem;color:var(--muted)}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5;scrollbar-gutter:stable}
.bar-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.progress{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.clock{font:600 1rem var(--f-mono);color:var(--ink)}
.clock.low{color:var(--red)}
.clock.paused{color:var(--muted)}
.tctl{display:flex;gap:8px}
.tbtn{width:var(--ctl);height:var(--ctl);box-sizing:border-box;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--paper);display:grid;place-items:center;cursor:pointer}
.tbtn:hover{background:var(--soft)}
.tbtn:disabled{opacity:.45;cursor:default}
.lapinfo{font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.confirm{color:var(--red)}
@media (max-width:849px){
  .row2{grid-template-columns:1fr}.tags{justify-content:flex-start}
  .trainrow{grid-template-columns:1fr!important}.trainrow .btn{justify-self:start}
}
@media (max-width:519px){
  .ctrls{grid-template-columns:1fr}
  .expr{flex:1 1 calc(100% - 2.6em)}.ansline{flex-basis:100%}.lbl{min-width:auto}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .trow{grid-template-columns:minmax(0,1fr) 60px 3em 1.4em}
}
@media (prefers-reduced-motion:no-preference){.item{transition:border-color .2s}}

/* вход, роль, родители */
.authcard{max-width:420px;margin:24px auto 0;padding:var(--pad-card);display:grid;gap:12px}
.authcard h2{margin:0;font-size:1.5rem}
.authcard .sub{margin:0}
.authcard .ctrl{display:grid;gap:4px}
.authcard .txt{width:100%}
.btn.wide{width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.roles{margin-top:4px}
.msg{margin:12px 0 0;font-size:.95rem}
.authcard .msg,.dialog .msg{margin:0}
.msg.err{color:var(--red)}
.code{font:500 1.2rem var(--f-mono);letter-spacing:.12em}
.srow .txt{width:100%}
.subhead:not(:has(.back)){margin-left:0}

/* окна подтверждения, семья, помощь */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(15,20,30,.45);display:grid;place-items:center;padding:16px}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-dlg);max-width:440px;width:100%;box-sizing:border-box;padding:24px;display:grid;gap:12px}
.dialog h2{margin:0;font-size:1.25rem}
.dialog p{margin:0}
.dialog .ctrl{display:grid;gap:4px}
.dialog .txt{width:100%}
.mbtns{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:4px}
body.modal-open{overflow:hidden}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost.danger{background:transparent;color:var(--red);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:.8rem;font-weight:600;text-align:center;line-height:20px}

.item.focus{outline:2px solid var(--pen);outline-offset:4px}
.item .opt,.item .btn,.item .tbtn{border-radius:calc(var(--r-item) - var(--pad-item))}

/* ===== Редизайн: эстетика референса 1 ===== */
@font-face{font-family:Manrope;font-weight:400;src:url(fonts/manrope-cyrillic-400-normal.woff2) format("woff2");unicode-range:U+0400-04FF}
@font-face{font-family:Manrope;font-weight:400;src:url(fonts/manrope-latin-400-normal.woff2) format("woff2")}

@font-face{font-family:Manrope;font-weight:500;src:url(fonts/manrope-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Manrope;font-weight:600;src:url(fonts/manrope-cyrillic-600-normal.woff2) format("woff2");unicode-range:U+0400-04FF}

:root{
  --bg:#eef3f8; --paper:#ffffff; --panel:#ffffff; --soft:#f3f7fb; --grid:#edf2f8;
  --ink:#13203b; --muted:#6b7a90; --line:#e3eaf2;
  --pen:#3b6fe0; --pen-soft:#eaf1fd;
  --red:#f15523; --green:#2fa36b; --amber:#d99a12;
  --h0:#e8eef5; --h1:#fcd3c6; --h2:#f79a7c; --h3:#f15523;
  --seg-track:#eef3f8; --seg-thumb:#ffffff;
  --f-body:Manrope,system-ui,sans-serif;
  --shadow:0 12px 32px rgba(19,32,59,.06),0 2px 6px rgba(19,32,59,.04);
  --r-ctl:21px; --r-card:28px; --r-item:20px; --pad-card:24px; --pad-item:12px;
  --c-coral:#f46b57; --c-yellow:#f5c84c; --c-teal:#5ec2b7; --c-lilac:#9b97f2; --c-sky:#6fa8f5; --c-green:#7ccb8e;
  --t-coral:#fde9e5; --t-yellow:#fdf5dc; --t-teal:#e2f5f2; --t-lilac:#eeedfd; --t-sky:#e7f1fe; --t-green:#e6f6ea;
}
.t-coral{--tc:var(--c-coral);--tt:var(--t-coral)} .t-yellow{--tc:var(--c-yellow);--tt:var(--t-yellow)} .t-teal{--tc:var(--c-teal);--tt:var(--t-teal)}
.t-lilac{--tc:var(--c-lilac);--tt:var(--t-lilac)} .t-sky{--tc:var(--c-sky);--tt:var(--t-sky)} .t-green{--tc:var(--c-green);--tt:var(--t-green)}
body{font-weight:500}
.nav{background:transparent;border-bottom:0;padding-block:16px}
.ttl{font-size:1.15rem;font-weight:800}
.wrap{padding-top:8px}
.group,.head,.sheet{border:0;box-shadow:var(--shadow)}
.head{padding:var(--pad-card)}
.ctrl>span,.sec{text-transform:none;letter-spacing:0;font-size:.9rem;font-weight:700;color:var(--ink)}
.sec{margin:32px 0 12px;font-size:1.05rem}
.subhead h2{font-size:2rem;font-weight:800;letter-spacing:-.02em}
.btn{border-radius:var(--r-ctl);font-weight:700}
.btn.ghost{background:var(--soft);border-color:transparent}
input[type=date],input.num,input.txt{border-radius:var(--r-ctl);background:var(--soft);border-color:transparent;padding:0 16px}
.seg{border-radius:var(--r-ctl);padding:3px}
.seg button{border-radius:calc(var(--r-ctl) - 3px)}
.seg button[aria-pressed="true"]{box-shadow:0 4px 12px rgba(19,32,59,.10)}
.chip{border:0;background:var(--soft);color:var(--muted);font-weight:600;padding:6px 14px 7px}
.chip.now{background:var(--tt);color:var(--ink)}
.chip.now::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tc);margin-right:8px}
.row2{border-top:0;padding-top:0}
.sheet{background-color:var(--paper);background-size:24px 24px}
.sheet::before{display:none}
.sheet{padding:32px 40px 40px}
.sheet-head h2{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
.hint{border:0;background:var(--soft);border-radius:16px;padding:12px 16px}
.item{border:0;background:#fff;box-shadow:0 2px 8px rgba(19,32,59,.06)}
.item.ok{box-shadow:0 0 0 2px var(--green)} .item.bad{box-shadow:0 0 0 2px var(--red)} .item.part{box-shadow:0 0 0 2px var(--amber)}
input.ans{border-radius:8px;border:0;border-bottom:2px solid var(--pen);background:var(--pen-soft)}
.score{border:0;background:var(--t-coral)}
.srow+.srow,.trow+.trow,.hrow+.hrow,.prog li+li,.faq details{border-color:var(--line)}
.kpis{border-top:0;gap:12px;padding:0 var(--pad-card) var(--pad-card)}
.kpi{background:var(--soft);border-radius:20px;padding:16px}
.kpi+.kpi{border-left:0}
.kpi b{font-size:1.6rem;font-weight:800}
.pcard{padding:var(--pad-card)}
.trow .meter,.meter{height:10px;border-radius:999px}
.trow .meter i,.trow.weak .meter i{background:var(--tc)}
.trow>span:first-child::before,.prog li>span:nth-child(2)::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--tc);margin-right:10px;vertical-align:1px}

.st.now{background:var(--pen-soft)} .st.done{background:var(--t-green)}
.bar{background:rgba(255,255,255,.85);border-top:0;box-shadow:0 -8px 24px rgba(19,32,59,.05)}
.tbtn{border:0;background:var(--soft);border-radius:var(--r-ctl)}
.dialog{border:0;box-shadow:0 24px 64px rgba(19,32,59,.18)}

/* ===== Движение: токены (из «Токены движения») ===== */
:root{
  --ease-press:cubic-bezier(.2,0,0,1); --ease-spring:cubic-bezier(.34,1.5,.64,1); --ease-spring-soft:cubic-bezier(.34,1.4,.64,1);
  --ease-pop:cubic-bezier(.34,1.6,.64,1); --ease-surface:cubic-bezier(.3,1.2,.5,1); --ease-glide:cubic-bezier(.2,.8,.3,1);
  --ease-standard:cubic-bezier(.4,0,.2,1); --ease-exit:cubic-bezier(.4,0,1,1); --ease-flight:cubic-bezier(.5,0,.3,1);
  --dur-tap:80ms; --dur-fade-fast:120ms; --dur-color:160ms; --dur-exit:200ms; --dur-release:260ms; --dur-pop:300ms;
  --dur-move:320ms; --dur-surface:360ms; --dur-flight:420ms;
}
@media (prefers-reduced-motion:reduce){:root{--dur-tap:1ms;--dur-fade-fast:1ms;--dur-color:1ms;--dur-exit:1ms;--dur-release:1ms;--dur-pop:1ms;--dur-move:1ms;--dur-surface:1ms;--dur-flight:1ms}}
/* нажатие — press · tap, отпускание — spring · release */
.btn,.opt,.tbtn,.ib,.back,.seg button{transition:transform var(--dur-release) var(--ease-spring),background-color var(--dur-color) var(--ease-standard),color var(--dur-color) var(--ease-standard)}
.btn:active:not(:disabled),.opt:active:not(:disabled),.tbtn:active:not(:disabled),.ib:active,.back:active{transform:scale(.96);transition:transform var(--dur-tap) var(--ease-press)}
.srow.link,.hrow{transition:background-color var(--dur-color) var(--ease-standard)}
/* переключатель: выбранный сегмент переезжает */
.seg{position:relative;isolation:isolate}
.seg .thumb{position:absolute;z-index:-1;left:0;top:3px;bottom:3px;border-radius:calc(var(--r-ctl) - 3px);background:var(--seg-thumb);box-shadow:0 4px 12px rgba(19,32,59,.10);transition:transform var(--dur-move) var(--ease-spring-soft),opacity var(--dur-fade-fast) var(--ease-standard);pointer-events:none}
.seg button[aria-pressed="true"]{background:transparent!important;box-shadow:none!important}
/* экран — без перелёта (glide) */
@keyframes inScreen{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#main.in-screen>*{animation:inScreen var(--dur-surface) var(--ease-glide) both}
/* новая работа: части листа по очереди, шаг 50 мс */
@keyframes inUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.in-up{animation:inUp var(--dur-surface) var(--ease-surface) both;animation-delay:var(--d,0ms)}
/* полоски тем заполняются */
@keyframes inFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.in-fill{transform-origin:left center;animation:inFill var(--dur-flight) var(--ease-glide) both;animation-delay:var(--d,0ms)}
/* значок — «чпок» */
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.badge{animation:pop var(--dur-pop) var(--ease-pop) both}
/* окно: вход с перелётом, уход без */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes dlgIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeOut{to{opacity:0}}
@keyframes dlgOut{to{opacity:0;transform:scale(.98)}}
.overlay.in{animation:fadeIn var(--dur-color) var(--ease-standard) both}
.overlay.in .dialog{animation:dlgIn var(--dur-surface) var(--ease-surface) both}
.overlay.out{animation:fadeOut var(--dur-exit) var(--ease-exit) both;pointer-events:none}
.overlay.out .dialog{animation:dlgOut var(--dur-exit) var(--ease-exit) both}
/* выход заметнее: в карточке профиля */
.pcard{grid-template-columns:56px minmax(0,1fr) auto}
.pcard .out{grid-column:3;grid-row:1/span 2;display:flex;align-items:center;gap:12px}

/* навбар: логотип спокойный, монохромный; фон с размытием, чтобы при прокрутке ничего не сливалось */
.nav{background:rgba(238,243,248,.86);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);transition:box-shadow var(--dur-color) var(--ease-standard)}

:root[data-theme="dark"] .nav{background:rgba(18,22,29,.86)}
.brand{align-items:baseline}
.brand .logo,.brand .navsep{align-self:center}
.logo{display:flex;align-items:center;background:none;border:0;padding:0;margin:0;color:var(--ink);cursor:pointer;transition:transform var(--dur-release) var(--ease-spring)}
.logo:active{transform:scale(.96);transition:transform var(--dur-tap) var(--ease-press)}
.logo-svg{height:24px;width:auto;display:block}
.navsep{width:1px;height:20px;background:var(--line)}
@media (max-width:519px){.navsep{display:none}.logo-svg{height:20px}}
[hidden]{display:none!important}
